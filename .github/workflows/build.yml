name: Build App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish to latest-debug release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Debug Build
          files: build/app/outputs/flutter-apk/app-debug.apk

  # ---------------------------------------------------------------------------
  # iOS build — ENABLED LATER, once you have an Apple Developer account.
  #
  # iOS apps can only be built on a macOS machine (GitHub provides macos-latest
  # runners for this). Producing an installable app for a real iPhone also needs
  # Apple code-signing (certificate + provisioning profile) stored as repo
  # secrets, and distribution via TestFlight. Until that's set up, this job is
  # left commented out so the Android build keeps working on its own.
  #
  # ios:
  #   name: Build iOS (needs Apple Developer account)
